name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Lint
        run: vendor/bin/phpcs

      - name: Static analysis
        # Only run on a single PHP version — PHPStan results don't
        # meaningfully differ across the supported range and running it
        # on every matrix entry just wastes CI minutes.
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Benchmarks
        # Guards the perf numbers in README. Runs on a single PHP version
        # so jitter across the matrix doesn't multiply false-fail risk.
        if: matrix.php == '8.3'
        env:
          TAILWINDPHP_BENCH: '1'
        run: vendor/bin/phpunit --filter BenchTest
